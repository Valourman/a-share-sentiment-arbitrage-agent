    // 1. Magic UI: Border Beam (仅在边框处发光的流光)
    function BorderBeam({
      colorFrom = "#EF4444",
      colorTo = "#F59E0B",
      className = ""
    }) {
      return (
        <div
          className={`pointer-events-none absolute inset-0 rounded-[inherit] ${className}`}
          style={{
            padding: "1.5px",
            background: `linear-gradient(135deg, ${colorFrom}, ${colorTo}, transparent 75%)`,
            WebkitMask: "linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0)",
            WebkitMaskComposite: "xor",
            maskComposite: "exclude",
          }}
        />
      );
    }

    // 2. Magic UI: Number Ticker (平滑三次缓动数值滚动器)
    function NumberTicker({
      value,
      decimals = 2,
      prefix = "",
      suffix = "",
      duration = 800,
      className = ""
    }) {
      const [displayVal, setDisplayVal] = useState(0);

      useEffect(() => {
        const end = typeof value === "number" ? value : parseFloat(value);
        if (isNaN(end)) return;

        let start = 0;
        const startTime = performance.now();
        let frameId;

        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // 经典 easeOutCubic 阻尼曲线
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          const current = start + (end - start) * easeProgress;
          setDisplayVal(current);

          if (progress < 1) {
            frameId = requestAnimationFrame(animate);
          }
        };

        frameId = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frameId);
      }, [value, duration]);

      return (
        <span className={className}>
          {prefix}
          {displayVal.toFixed(decimals)}
          {suffix}
        </span>
      );
    }

                                <span className="font-bold text-sm text-red-600 dark:text-red-400 flex items-center gap-1.5 font-display">
                                  <i data-lucide="shield-alert" className="w-4 h-4"></i>
                                  {activeSession.reflection.divergence_type}
                                </span>
                              </div>

                              <span className="text-xs px-2.5 py-0.5 rounded-full font-semibold font-mono bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300">
                                风险等级: {activeSession.reflection.risk_level}
                              </span>
                            </div>

                            <div className="text-xs sm:text-sm text-neutral-700 dark:text-neutral-300 leading-relaxed mb-4">
                              <strong className="text-neutral-900 dark:text-white font-medium">研判推导逻辑：</strong>
                              {activeSession.reflection.reflection_narrative}
                            </div>

                            <div className="p-3.5 rounded-2xl bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/5 flex items-start gap-2.5 text-xs leading-relaxed">
                              <i data-lucide="compass" className="w-4 h-4 text-blue-500 shrink-0 mt-0.5"></i>
                              <div>
                                <span className="font-semibold text-neutral-900 dark:text-neutral-100">交易决策风控参考：</span>
                                <span className="text-neutral-600 dark:text-neutral-300">{activeSession.reflection.action_suggestion}</span>
                              </div>
                            </div>
                          </div>
                        </div>

                        {/* 3. 多空研究员激辩竞技卡 (Debate Arena Card) */}
                        <div className="p-4 sm:p-5 rounded-3xl border border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02] space-y-3">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold flex items-center gap-1.5 font-display text-neutral-700 dark:text-neutral-300">
                              <i data-lucide="swords" className="w-3.5 h-3.5 text-indigo-500"></i>
                              多空对抗激辩决议 (Debate Protocol)
                            </span>
                            <div className="flex items-center gap-2 text-[10px] font-mono">
                              <span className="text-red-500 font-semibold">多头 {activeSession.reflection.debate.bull_score}%</span>
                              <span className="text-neutral-400">vs</span>
                              <span className="text-emerald-500 font-semibold">空头 {activeSession.reflection.debate.bear_score}%</span>
                            </div>
                          </div>

                          {/* 能量条 */}
                          <div className="h-2 w-full rounded-full bg-neutral-200 dark:bg-neutral-800 overflow-hidden flex">
                            <div className="bg-red-500 transition-all duration-500" style={{ width: `${activeSession.reflection.debate.bull_score}%` }}></div>
                            <div className="bg-emerald-500 transition-all duration-500" style={{ width: `${activeSession.reflection.debate.bear_score}%` }}></div>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 text-xs">
                            <div className="p-3 rounded-2xl bg-red-500/5 border border-red-500/10 space-y-1">
                              <div className="font-semibold text-red-600 dark:text-red-400 flex items-center gap-1 text-[11px]">
                                <i data-lucide="trending-up" className="w-3 h-3"></i>
                                多头分析师观点
                              </div>
                              <p className="text-neutral-600 dark:text-neutral-300 leading-relaxed text-[11.5px]">
                                {activeSession.reflection.debate.bull_arg}
                              </p>
                            </div>
                            <div className="p-3 rounded-2xl bg-emerald-500/5 border border-emerald-500/10 space-y-1">
                              <div className="font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1 text-[11px]">
                                <i data-lucide="trending-down" className="w-3 h-3"></i>
                                空头分析师质询
                              </div>
                              <p className="text-neutral-600 dark:text-neutral-300 leading-relaxed text-[11.5px]">
                                {activeSession.reflection.debate.bear_arg}
                              </p>
                            </div>
                          </div>
                        </div>

                        {/* 4. Gemini 思维链折叠 */}
                        <div className="rounded-3xl border border-black/5 dark:border-white/5 overflow-hidden bg-black/[0.02] dark:bg-white/[0.02]">
                          <button
                            onClick={() => setIsThinkingExpanded(!isThinkingExpanded)}
                            className="w-full px-5 py-3.5 flex items-center justify-between text-xs font-medium text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100"
                          >
                            <div className="flex items-center gap-2">
                              <i data-lucide="bot" className="w-4 h-4 text-indigo-500"></i>
                              <span className="font-mono">Gemini 大模型思维链推理过程 ({activeSession.reflection.thinking_steps.length} 步骤)</span>
                            </div>
                            <i data-lucide={isThinkingExpanded ? "chevron-down" : "chevron-right"} className="w-4 h-4"></i>
                          </button>

                          {isThinkingExpanded && (
                            <div className="px-5 pb-4 pt-1 space-y-2 border-t border-black/5 dark:border-white/5 text-xs text-neutral-600 dark:text-neutral-400">
                              {activeSession.reflection.thinking_steps.map((step, idx) => (
                                <div key={idx} className="flex items-start gap-2 pl-2 border-l-2 border-indigo-500/50">
                                  <span className="leading-relaxed">{step}</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* 5. 散户发帖语料与消歧明细 */}
                        <div className="space-y-3">
                          <div className="flex items-center justify-between px-1">
                            <h3 className="text-xs font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500 flex items-center gap-1.5 font-mono">
                              <i data-lucide="bar-chart-3" className="w-3.5 h-3.5"></i>
                              散户语料样本与消歧详情 ({activeSession.sentiment_list.length} 条样本)
                            </h3>
                            <span className="text-[11px] text-neutral-400 font-mono">Jev 零截断强类型消歧</span>
                          </div>

                          <div className="space-y-3">
                            {activeSession.sentiment_list.map((item) => (
                              <div
                                key={item.id}
                                className={`p-4 rounded-3xl border transition-all ${
                                  isDark ? "bg-gemini-surfaceDark/50 hover:bg-gemini-surfaceDark border-white/5" : "bg-white hover:bg-neutral-50/80 border-black/5 shadow-sm"
                                }`}
                              >
                                <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                                  <div className="flex items-center gap-2">
                                    <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                                      item.stance.includes("看多")
                                        ? "bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300"
                                        : item.stance.includes("看空")
                                        ? "bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300"
                                        : "bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300"
                                    }`}>
                                      {item.stance}
                                    </span>

                                    {item.is_sarcasm && (
                                      <span className="flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 font-mono">
                                        <i data-lucide="flame" className="w-3 h-3 text-amber-500"></i>
                                        反讽命中 {item.prob}
                                      </span>
                                    )}

                                    {item.slangs.map((slang, sIdx) => (
                                      <span key={sIdx} className="px-2 py-0.5 rounded-md text-[10px] bg-neutral-100 dark:bg-neutral-800 text-neutral-500 font-mono">
                                        #{slang}
                                      </span>
                                    ))}
                                  </div>

                                  <div className="font-mono text-xs font-semibold text-neutral-500">
                                    情绪得分: <span className={item.score >= 0 ? "text-red-500" : "text-emerald-500"}>{item.score > 0 ? `+${item.score.toFixed(2)}` : item.score.toFixed(2)}</span>
                                  </div>
                                </div>

                                <div className="text-xs sm:text-sm text-neutral-800 dark:text-neutral-200 mb-2 pl-3 border-l-2 border-neutral-300 dark:border-neutral-700 italic">
                                  “{item.original_post}”
                                </div>

                                <div className="text-[11px] text-neutral-500 dark:text-neutral-400 flex items-start gap-1.5 pt-1">
                                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-blue-500 shrink-0 mt-0.5"></i>
                                  <span>大模型反思依据: {item.reasoning}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* 6. 底部工具栏 */}
                        <div className="flex items-center gap-1 text-neutral-400 pt-2 border-t border-black/5 dark:border-white/5">
                          <button onClick={copyReport} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5" title="复制研判结论">
                            <i data-lucide={copied ? "check" : "copy"} className={`w-4 h-4 ${copied ? "text-emerald-500" : ""}`}></i>
                          </button>
                          <button onClick={() => handleTrigger(activeSession.stock_code)} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5" title="重新研判">
                            <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                          </button>
                          <button className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5" title="好评反馈">
                            <i data-lucide="thumbs-up" className="w-4 h-4"></i>
                          </button>
                          <div className="ml-auto text-[10px] text-neutral-400 font-mono">
                            TypeSafe Jev + Gemini Pro · 耗时 826ms · {activeSession.timestamp}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* 视口中下方悬浮复合胶囊输入舱 (Floating Input Pill) */}
            <div className="absolute bottom-0 left-0 right-0 p-4 sm:p-6 pointer-events-none z-20 flex justify-center">
              <div className="w-full max-w-3xl pointer-events-auto">
                <div className={`relative overflow-hidden p-2 sm:p-2.5 rounded-3xl sm:rounded-full shadow-2xl border backdrop-blur-2xl transition-all ${
                  isDark
                    ? "bg-gemini-surfaceDark/90 border-white/10 shadow-black/80"
                    : "bg-white/90 border-black/10 shadow-slate-200/80"
                }`}>
                  <BorderBeam colorFrom="#4285F4" colorTo="#9B72CF" />
                  <div className="relative z-10 flex items-center gap-2">
                    {/* 代码选择输入框 */}
                    <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/5 dark:bg-white/5 text-xs text-neutral-600 dark:text-neutral-300 font-mono">
                      <i data-lucide="search" className="w-3.5 h-3.5 text-neutral-400"></i>
                      <input
                        type="text"
                        value={stockCode}
                        onChange={(e) => setStockCode(e.target.value)}
                        placeholder="代码 (600584)"
                        className="bg-transparent border-none outline-none w-24 text-xs font-mono"
                      />
                    </div>

                    <input
                      id="floatingInput"
                      type="text"
                      value={naturalPrompt}
                      onChange={(e) => setNaturalPrompt(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") handleTrigger(); }}
                      placeholder={stockCode ? `研判 [${stockCode}] 的主力意图与散户反讽背离...` : "输入 6 位 A 股股票代码或研判指令 (按 ⌘K 聚焦)..."}
                      className="flex-1 bg-transparent px-3 py-2 text-xs sm:text-sm placeholder:text-neutral-400 outline-none border-none"
                    />

                    <button
                      onClick={() => setIsParamDrawerOpen(!isParamDrawerOpen)}
                      className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200"
                      title="研判参数"
                    >
                      <i data-lucide="sliders-horizontal" className="w-4 h-4"></i>
                    </button>

                    <button
                      onClick={() => handleTrigger()}
                      disabled={isLoading}
                      className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white flex items-center justify-center shadow-md active:scale-95 transition-all disabled:opacity-50 shrink-0"
                      title="启动智能研判"
                    >
                      <i data-lucide={isLoading ? "rotate-ccw" : "send"} className={`w-4 h-4 ${isLoading ? "animate-spin" : "ml-0.5"}`}></i>
                    </button>
                  </div>
                </div>
                <div className="text-center text-[10px] text-neutral-400 dark:text-neutral-500 mt-2 font-mono">
                  ALPHA-SENSE 研判基于 TypeSafe Jev 强类型单步决策与 L1 盘面实时基准，不构成直接买卖依据。
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
